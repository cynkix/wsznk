<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zenika Site Versions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap">
<style>
:root{--bar:#0E0F13;--bar-text:#FFFFFF;--muted:#A3A7B3;--accent:#EE2238;--line:rgba(255,255,255,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#0E0F13}}
:root[data-theme="dark"]{--bar:#0E0F13}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0E0F13;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#FFF}
</style>
</head>
<body>
<iframe id="frame" title="Prototype du site Zenika" src="v1.html"></iframe>
<script>
/* Ajouter une idée : déposer vN.html et ajouter une ligne ici. */
var VERSIONS=[
  {id:'v1',file:'v1.html',name:'V1 · Z 3D',note:'Le Z reste à l’écran et se transforme : Z, case cochée, puis symbole du temps selon les sections'},
  {id:'v2',file:'v2.html',name:'V2 · Dégradé rouge',note:'Bande dégradée blanc vers rouge (constat + solutions), démarche à plat avec règle graduée, figure 3D qui évolue au scroll'},
  {id:'v4',file:'v4.html',name:'V3 · Hero',note:'Photo d’accueil, puis le corps de « Nos solutions » : défis en barres segmentées, offres et programmes, ROI, convictions'},
  {id:'v8',file:'v8.html',name:'V4 · Landing',note:'Nouveau design inspiré de « Vis ma vie de designer » : bleu nuit, cartes très arrondies avec une carte rouge en relief, alternance de blocs sombres et clairs, Z 3D en tête, finale dégradée rouge'},
  {id:'v3',file:'v3.html',name:'V5 · Intro Z 3D',note:'Intro plein écran avec le Z en lignes 3D qui suit la souris, constat en deux cartes, solutions en grille, « Notre démarche »'},
  {id:'v7',file:'v7.html',name:'V6 · TechnoZ',note:'Accueil en écran partagé : à gauche la photo en carrousel de la V3, à droite le Z 3D de la V5 ; la suite reprend la V5'},
  {id:'v9',file:'v9.html',name:'V8 · Copie de V1',note:'Point de départ : copie de la V1 · Z 3D, pour tester de nouvelles idées sans toucher à l’original'},
  {id:'v10',file:'v10.html',name:'V9 · Challenge',note:'Carte blanche : une promesse, quatre paires « aujourd’hui → avec Zenika », puis quatre offres et la façon de travailler, pour comprendre le site en un coup d’œil'},
  {id:'v6',file:'v6.html',name:'Archive · Six phases + programmes illustrés',note:'Roue du PDLC en six étapes, programmes illustrés, six bénéfices animés sur « Votre ROI »'},
  {id:'v5',file:'v5.html',name:'Archive · Intro Z 3D · ADN + engagements',note:'Comme V5, avec en plus « Notre ADN » (mission critical) et « Nos engagements »'},
  {id:'v0',file:'v0.html',name:'Archive · Alex',note:'Prototype « Corporate Blanc » d’Alexandra, tel quel'}
];
var frame=document.getElementById('frame');
function show(id){
  var v=VERSIONS.filter(function(x){return x.id===id;})[0]||VERSIONS[0];
  document.title='Zenika · '+v.name;
  try{frame.contentWindow.scrollTo(0,0);}catch(e){}
  frame.setAttribute('src',v.file+'?r='+Date.now());
  try{history.replaceState(null,'','#'+v.id);}catch(e){}
  try{localStorage.setItem('zk-version2',v.id);}catch(e){}
}
var start=(location.hash||'').slice(1);
if(!start){try{start=localStorage.getItem('zk-version2')||'';}catch(e){}}
show(start||"v1");
window.zkShow=show;
</script>
</body>
</html>
