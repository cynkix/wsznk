<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zenika Site Versions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap">
<style>
:root{--bar:#0E0F13;--bar-text:#FFFFFF;--muted:#A3A7B3;--accent:#EE2238;--line:rgba(255,255,255,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#0E0F13}}
:root[data-theme="dark"]{--bar:#0E0F13}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0E0F13;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#FFF}
</style>
</head>
<body>
<iframe id="frame" title="Prototype du site Zenika" src="v1.html"></iframe>
<script>
/* Ajouter une idée : déposer vN.html et ajouter une ligne ici. */
var VERSIONS=[
  {id:'v1',file:'v1.html',name:'V1 · Défis en bandeau rouge + livraison',note:'Défis en bandeau plein écran, « Ce que nous livrons » en réponse avant la méthodologie'},
  {id:'v2',file:'v2.html',name:'V2 · Défis en rouge dans le scroll',note:'Mots-clés des freins reliés, solutions en liste, navigation libellée'},
  {id:'v3',file:'v3.html',name:'V3 · Prototype style training',note:'Hero centré + carte vidéo'}
];
var frame=document.getElementById('frame');
function show(id){
  var v=VERSIONS.filter(function(x){return x.id===id;})[0]||VERSIONS[0];
  document.title='Zenika · '+v.name;
  frame.setAttribute('src',v.file+'?r='+Date.now());
  try{history.replaceState(null,'','#'+v.id);}catch(e){}
  try{localStorage.setItem('zk-version2',v.id);}catch(e){}
}
var start=(location.hash||'').slice(1);
if(!start){try{start=localStorage.getItem('zk-version2')||'';}catch(e){}}
show(start||VERSIONS[0].id);
window.zkShow=show;
</script>
</body>
</html>
